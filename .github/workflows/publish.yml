name: Release
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.0.5)
        required: true

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    # Immutable releases forbid attaching assets after publishing, so the plugin ships via JetBrains Marketplace only.
    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      # The change notes come from the tag's CHANGELOG.md, already holding the release section from the version bump commit.
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
