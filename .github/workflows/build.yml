name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The configuration cache is only saved when encrypted, without a key every run re-configures from scratch.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Only main writes caches, PR builds restore them without racing to overwrite entries.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Verify Plugin
        run: ./gradlew verifyPlugin

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kore-assistant
          path: ./build/distributions/*
